name: Deploy to Debian server
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.txt || true

      # --delete is destructive, so everything that lives only on the server
      # must be excluded here: the SQLite database, the TLS certs, the .env
      # holding ADMIN_API_KEY/GOOGLE_MAPS_KEY, and the database backups.
      - name: Copy files to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude 'data'
            --exclude 'backups'
            --exclude '.env*'
            --exclude 'nginx/certs'
            --exclude '.git'
            --exclude '__pycache__'
            --exclude 'portal.db'
            --exclude '.claude'
          path: ./
          remote_path: /opt/jelajah/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Rebuild on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # The prod override supplies the TLS mounts, the shared edge network
          # and the restart policy -- without it the base compose starts a
          # different, unrouted stack.
          script: |
            set -e
            cd /opt/jelajah
            cp data/portal.db "backups/portal.db.ci-$(date +%Y%m%d-%H%M%S)" 2>/dev/null || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            code=$(curl -4 -s -o /dev/null -w '%{http_code}' -m 15 https://halalmuslimtravel.com/api/stats || true)
            [ "$code" = "200" ] && echo "site healthy (200)" && exit 0
            echo "attempt $i: got '$code', retrying..."; sleep 10
          done
          echo "site did not return 200 after deploy"; exit 1
