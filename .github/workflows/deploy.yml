name: Deploy to Debian server
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.txt || true

      # SSH is set up by hand rather than via a marketplace action. GitHub's
      # secret store strips the trailing newline from multi-line values, and
      # OpenSSH rejects a key without one ("error in libcrypto") -- printf
      # restores it. Doing it here also drops two third-party actions from the
      # supply chain and makes failures readable.
      - name: Set up SSH
        env:
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Prefer SSH_KEY_B64: a single-line value survives the secret store
          # intact, whereas a pasted multi-line key loses its trailing newline
          # (and often picks up stray indentation), which OpenSSH rejects with
          # "error in libcrypto".
          if [ -n "${SSH_KEY_B64:-}" ]; then
            printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
            echo "using SSH_KEY_B64"
          elif [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            echo "using SSH_KEY (raw)"
          else
            echo "::error::Neither SSH_KEY_B64 nor SSH_KEY is set."; exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::The deploy key is not a valid private key. Set SSH_KEY_B64 to the output of: base64 -w0 ~/.ssh/jelajah_ci_deploy2"; exit 1; }
          echo "key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "ssh key loaded, host key pinned"

      - name: Copy files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          # --delete is destructive: everything that exists only on the server
          # (database, backups, .env secrets, TLS certs) must be excluded.
          rsync -avzr --delete \
            --exclude 'data' \
            --exclude 'backups' \
            --exclude '.env*' \
            --exclude 'nginx/certs' \
            --exclude '.git' \
            --exclude '__pycache__' \
            --exclude 'portal.db' \
            --exclude '.claude' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            ./ "$SSH_USER@$SSH_HOST:/opt/jelajah/"

      - name: Rebuild on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" bash -euo pipefail <<'REMOTE'
            cd /opt/jelajah
            cp data/portal.db "backups/portal.db.ci-$(date +%Y%m%d-%H%M%S)" 2>/dev/null || true
            # The prod override carries the TLS mounts, the shared edge network
            # and the restart policy; without it this starts an unrouted stack.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          REMOTE

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            code=$(curl -4 -s -o /dev/null -w '%{http_code}' -m 15 https://halalmuslimtravel.com/api/stats || true)
            if [ "$code" = "200" ]; then echo "site healthy (200)"; exit 0; fi
            echo "attempt $i: got '$code', retrying..."; sleep 10
          done
          echo "::error::site did not return 200 after deploy"; exit 1
