# Standalone/self-signed override for single-tenant hosts — used by deploy.sh.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Publishes nginx directly on 80/443 with the self-signed cert generated by
# deploy.sh/setup-ssl.sh. Not used on shared hosts — see docker-compose.prod.yml
# for the fully-isolated, real-cert, edge-router-fronted deployment.
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
