<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Jelajah Halal">
  <defs>
    <linearGradient id="jhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a6b4b"/>
      <stop offset="1" stop-color="#0e7c86"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="48" height="48" rx="12" fill="url(#jhBg)"/>

  <!-- flanking minarets -->
  <g fill="#ffffff" opacity=".78">
    <path d="M11.2 21.6a1.9 1.9 0 0 1 3.8 0V36h-3.8z"/>
    <path d="M33 21.6a1.9 1.9 0 0 1 3.8 0V36H33z"/>
  </g>

  <!-- finial -->
  <circle cx="24" cy="11.2" r="1.55" fill="#e3c176"/>
  <rect x="23.5" y="12.4" width="1" height="2.2" fill="#e3c176"/>

  <!-- dome -->
  <path d="M15.4 25.2c0-6.1 4.1-8.9 8.6-10.8 4.5 1.9 8.6 4.7 8.6 10.8z" fill="#fff"/>

  <!-- prayer-hall body -->
  <path d="M15.4 25.2h17.2V36H15.4z" fill="#fff"/>

  <!-- gold sill -->
  <rect x="15.4" y="26.6" width="17.2" height="1.15" fill="#e3c176" opacity=".95"/>

  <!-- pointed arch, cut through to the badge -->
  <path d="M24 29.4c-2.35 0-4.25 1.9-4.25 4.25V36h8.5v-2.35c0-2.35-1.9-4.25-4.25-4.25z" fill="url(#jhBg)"/>
</svg>
